name: paisa
description: "Paisa - Personal Finance & Expense Tracker in Flutter with Google Drive Sync"
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  http: ^1.2.1
  intl: ^0.19.0
  pdf: ^3.10.8
  printing: ^5.13.1
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  file_picker: ^8.0.3
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2
  uuid: ^4.4.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
